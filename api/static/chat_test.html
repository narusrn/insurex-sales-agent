<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>InsureX Sales Agent — Live API Test</title>
<style>
  :root {
    --bg: #0f1115; --panel: #1a1d24; --bubble-user: #2563eb; --bubble-ai: #22252c;
    --text: #e8e9ec; --muted: #8a8f98; --accent: #60a5fa; --card: #262a33; --border: #333845;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "Sarabun", sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 16px 12px; gap: 12px;
  }
  h1 { font-size: 16px; margin: 0; }
  .config {
    width: 460px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .config label { color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  .config input { background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 5px 8px; font-size: 12.5px; }
  .config .row { display: flex; gap: 8px; }
  .config .row > label { flex: 1; }

  .phone {
    width: 460px; height: 640px; background: var(--panel); border-radius: 18px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); display: flex; flex-direction: column;
  }
  .header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .header .dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; }
  .header .dot.off { background: #555; }
  .header b { font-size: 14px; }
  .header span { font-size: 11px; color: var(--muted); }
  .messages { padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; }

  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.6;
    white-space: pre-wrap;
  }
  .bubble.user { background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .bubble.ai { background: var(--bubble-ai); border-bottom-left-radius: 4px; }

  .status-line { font-size: 11.5px; color: var(--accent); margin-left: 2px; }

  .input-row { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .input-row input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 9px 12px; font-size: 13px; }
  .input-row button { background: var(--accent); border: none; border-radius: 10px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  .input-row button:disabled { opacity: .5; cursor: default; }
  .footer-note { color: var(--muted); font-size: 11px; max-width: 460px; text-align: center; }
  .sess-id { color: var(--muted); font-size: 10.5px; }
</style>
</head>
<body>
  <h1>InsureX Sales Agent — เชื่อม API จริง (local test)</h1>

  <div class="config">
    <div class="row">
      <label>Base URL <input id="baseUrl" value="http://127.0.0.1:8000"></label>
    </div>
    <label>X-API-Key <input id="apiKey" type="password" placeholder="วางค่า API_KEY จาก .env ตรงนี้"></label>
    <div class="row">
      <span class="sess-id">session_id: <span id="sessIdDisplay"></span></span>
      <button id="resetBtn" style="margin-left:auto;background:#333845;border:none;color:var(--text);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;">เริ่มบทสนทนาใหม่</button>
    </div>
  </div>

  <div class="phone">
    <div class="header">
      <div class="dot off" id="connDot"></div>
      <div><div><b>InsureX Sales Agent</b></div><span id="statusText">พร้อมคุย — พิมพ์ข้อความด้านล่าง</span></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input id="msgInput" placeholder="พิมพ์คำถาม เช่น Health Plus มีแผนอะไรบ้าง" autocomplete="off">
      <button id="sendBtn">ส่ง</button>
    </div>
  </div>
  <p class="footer-note">เชื่อม <code>POST /api/v1/chat</code> จริงผ่าน fetch + ReadableStream (ไม่ใช้ EventSource เพราะต้องส่ง header/POST body) — token มาแบบ stream จริง ไม่ได้ buffer รอจบก่อนแสดง</p>

<script>
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const resetBtn = document.getElementById('resetBtn');
const statusText = document.getElementById('statusText');
const connDot = document.getElementById('connDot');
const sessIdDisplay = document.getElementById('sessIdDisplay');

function newSessionId() {
  return (crypto.randomUUID ? crypto.randomUUID() : 'sess-' + Math.random().toString(36).slice(2));
}

let sessionId = newSessionId();
sessIdDisplay.textContent = sessionId;
let sending = false;

function addBubble(role, text) {
  const row = document.createElement('div');
  row.className = 'bubble-row ' + (role === 'user' ? 'user' : '');
  const b = document.createElement('div');
  b.className = 'bubble ' + (role === 'user' ? 'user' : 'ai');
  b.textContent = text;
  row.appendChild(b);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return b;
}

function addStatusLine(label) {
  const el = document.createElement('div');
  el.className = 'status-line';
  el.textContent = '● ' + label;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

resetBtn.onclick = () => {
  sessionId = newSessionId();
  sessIdDisplay.textContent = sessionId;
  messagesEl.innerHTML = '';
  statusText.textContent = 'เริ่มบทสนทนาใหม่แล้ว';
};

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || sending) return;
  const baseUrl = document.getElementById('baseUrl').value.replace(/\/$/, '');
  const apiKey = document.getElementById('apiKey').value;

  sending = true;
  sendBtn.disabled = true;
  msgInput.value = '';
  addBubble('user', text);
  connDot.classList.remove('off');
  statusText.textContent = 'กำลังเชื่อมต่อ...';

  let aiBubble = null;

  try {
    const resp = await fetch(`${baseUrl}/api/v1/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });

    if (!resp.ok) {
      const errBody = await resp.text();
      addBubble('ai', `[HTTP ${resp.status}] ${errBody}`);
      statusText.textContent = 'เกิดข้อผิดพลาด';
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let sep;
      while ((sep = buffer.indexOf('\n\n')) !== -1) {
        const rawEvent = buffer.slice(0, sep);
        buffer = buffer.slice(sep + 2);

        let eventType = null;
        let dataLine = null;
        for (const line of rawEvent.split('\n')) {
          if (line.startsWith('event:')) eventType = line.slice(6).trim();
          else if (line.startsWith('data:')) dataLine = line.slice(5).trim();
        }
        if (!dataLine) continue;
        let payload;
        try { payload = JSON.parse(dataLine); } catch { continue; }

        if (eventType === 'status') {
          const label = `กำลังเรียกใช้ ${payload.tool}...`;
          statusText.textContent = label;
          addStatusLine(label);
        } else if (eventType === 'done') {
          statusText.textContent = 'พร้อมคุย — พิมพ์ข้อความด้านล่าง';
        } else if (payload.type === 'token') {
          if (!aiBubble) aiBubble = addBubble('ai', '');
          aiBubble.textContent += payload.content;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      }
    }
  } catch (e) {
    addBubble('ai', `[Network error] ${e.message} — เช็คว่า server รันอยู่ที่ base URL ที่ใส่ไว้ไหม`);
    statusText.textContent = 'เชื่อมต่อไม่ได้';
  } finally {
    sending = false;
    sendBtn.disabled = false;
    connDot.classList.add('off');
  }
}

sendBtn.onclick = sendMessage;
msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
